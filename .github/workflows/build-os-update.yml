name: Build and publish FalconOS OS update
on:
  push:
    branches: [updates]
    paths:
      - 'os/source.json'
      - '.github/workflows/build-os-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: falconos-os-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates
          fetch-depth: 1
      - name: Resolve immutable FalconOS source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,re
          data=json.load(open('os/source.json'))
          assert data['version']=='2.0.2-beta'
          assert data['source_repository']=='hanefimert2016-oss/FalconOS'
          assert re.fullmatch(r'[0-9a-f]{40}',data['source_commit'])
          print('KERNEL_SOURCE_SHA='+data['source_commit'])
          PY
      - name: Build native GRUB-free update ISO from reviewed source
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm xorriso mtools clang lld binutils gcc python3 python3-pil qemu-system-x86 ovmf
          mkdir source-checkout
          git -C source-checkout init -q
          git -C source-checkout remote add origin https://github.com/hanefimert2016-oss/FalconOS.git
          git -C source-checkout fetch --depth=1 origin "$KERNEL_SOURCE_SHA"
          git -C source-checkout checkout --detach FETCH_HEAD
          make -C source-checkout iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=0 EXTRA_CFLAGS='-DFALCON_OS_UPDATE_VERSION=202'
          strings source-checkout/build/falcon.elf | grep -F 'FalconOS 2.0.2 Beta'
          file source-checkout/build/BOOTX64.EFI | grep -F 'PE32+'
          test -s source-checkout/build/FalconOS.iso
      - name: Boot newer FalconOS in real OVMF QEMU and validate virtual CD switching
        shell: bash
        run: |
          set -euo pipefail
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/falcon-update-test-vars.fd
          timeout 55s qemu-system-x86_64 -machine q35 -accel tcg -m 1024 -smp 1 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,unit=1,file=/tmp/falcon-update-test-vars.fd \
            -cdrom source-checkout/build/FalconOS.iso \
            -display none -monitor none -serial none -no-reboot \
            -debugcon file:/tmp/falcon-update-boot.log -global isa-debugcon.iobase=0xe9 || test "$?" -eq 124
          grep -F 'FALCONBOOT/1 HANDOFF' /tmp/falcon-update-boot.log
          python3 - <<'PY'
          import importlib.util,pathlib,shutil,socket,subprocess,tempfile,time
          p=pathlib.Path("source-checkout/tools/falcon_os_update_bridge.py")
          spec=importlib.util.spec_from_file_location("up",p)
          up=importlib.util.module_from_spec(spec);spec.loader.exec_module(up)
          original=pathlib.Path("source-checkout/build/FalconOS.iso").resolve()
          with tempfile.TemporaryDirectory() as td:
              dst=pathlib.Path(td)/"verified-update.iso"
              shutil.copyfile(original,dst)
              monitor=pathlib.Path(td)/"monitor.sock"
              proc=subprocess.Popen([
                  "qemu-system-x86_64","-machine","q35","-accel","tcg",
                  "-m","256","-display","none","-serial","none",
                  "-drive",f"file={original},if=ide,index=2,media=cdrom,id=falcon_os_cd",
                  "-monitor",f"unix:{monitor},server=on,wait=off","-no-reboot"
              ],stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              try:
                  for _ in range(130):
                      if monitor.exists():break
                      if proc.poll() is not None:raise RuntimeError(proc.stderr.read().decode())
                      time.sleep(.1)
                  else:raise TimeoutError("QEMU monitor unavailable")
                  up.command_hmp(str(monitor),dst)
                  print("PASS: actual QEMU CD-ROM updated to new verified ISO, original untouched")
              finally:
                  proc.terminate()
                  try:proc.wait(timeout=8)
                  except subprocess.TimeoutExpired:proc.kill()
          PY
      - name: Publish immutable ISO and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION='2.0.2-beta'
          TAG="os-v${VERSION}"
          ASSET="FalconOS-${VERSION}.iso"
          cp source-checkout/build/FalconOS.iso "${ASSET}"
          SIZE=$(wc -c < "${ASSET}")
          SHA=$(sha256sum "${ASSET}" | awk '{print $1}')
          sha256sum "${ASSET}" > "${ASSET}.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable update release already exists: $TAG"
            mkdir -p /tmp/verified-release
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "${ASSET}" -D /tmp/verified-release
            # ISO9660 includes build timestamps: rebuilding the same pinned
            # source need not yield byte-identical media. An existing release
            # is immutable; use its ALREADY PUBLISHED verified ISO as source
            # of truth, never silently replace a release on a new CI run.
            cp "/tmp/verified-release/${ASSET}" "${ASSET}"
            SIZE=$(wc -c < "${ASSET}")
            SHA=$(sha256sum "${ASSET}" | awk '{print $1}')
          else
            gh release create "$TAG" "${ASSET}" "${ASSET}.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "FalconOS ${VERSION} UEFI system update" --latest=false \
              --notes "Bootable native FalconBoot UEFI ISO from pinned FalconOS source $KERNEL_SOURCE_SHA. For QEMU/OVMF only. No physical drive updates."
          fi
          printf 'FOSUP/1\nversion=%s\ntag=%s\nasset=%s\nsha256=%s\nbytes=%s\n' \
            "$VERSION" "$TAG" "$ASSET" "$SHA" "$SIZE" > os/latest.fosup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/latest.fosup
          if ! git diff --cached --quiet; then
            git commit -m "chore(updates): register verified ${VERSION} ISO digest [skip ci]"
            git fetch origin updates
            git rebase origin/updates
            git push origin HEAD:updates
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FalconOS-UEFI-Update-2.0.2-beta
          path: |
            FalconOS-2.0.2-beta.iso
            FalconOS-2.0.2-beta.iso.sha256
            os/latest.fosup
          retention-days: 30
